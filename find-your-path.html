    {n:"Customer Success Manager",d:"Help paying customers get results so they stay with a company.",i:["talk","organise"],lv:2,cost:0,dev:"laptop",speed:3,goals:["job"]},

    {n:"Product Operations Specialist",d:"Keep a software product's teams and processes organised.",i:["organise","tech"],lv:2,cost:0,dev:"laptop",speed:3,goals:["job"],gem:true}
  ];

  /* words people type -> interest */
  var WORDS = {
    talk:["talk","speak","people","chat","call","communicat","friendly","customer"],
    write:["write","writing","blog","content","caption","english","essay","story"],
    create:["design","video","edit","photo","creative","canva","draw","film","tiktok","reels"],
    numbers:["number","math","data","excel","analy","account","finance","logic","stat","sql","python","power bi","tableau","dashboard","bookkeep","audit","econom","engineer","actuar","spreadsheet"],
    organise:["organi","plan","schedule","admin","detail","manage","coordinate","secretar"],
    sell:["sell","sales","market","negotiat","persuad","business","promot","affiliate"],
    teach:["teach","tutor","explain","lecture","train","mentor","coach"],
    trade:["bak","cake","shoe","cobbler","tailor","sew","fashion","cloth","hair","makeup","make-up","catering","cook","food","bag","trader","shop","store","vendor","farm","carpent","plumb","electric","mechanic","driver","craft","bead","jewel","furniture","salon","barber","painter","provision","retail","vocational","i sell","i make","handmade"],
    tech:["tech","computer","software","app","code","coding","program","develop","javascript","html","cyber","network","it support","it ","automat","website","internet"]
  };

  var A = {name:"",strong:[],strongText:"",goal:"",budget:"",device:"",time:"",background:"",email:""};
  var chat = document.getElementById("chat");
  var composer = document.getElementById("composer");
  var field = document.getElementById("field");
  var form = document.getElementById("form");
  var consentWrap = document.getElementById("consentWrap");
  var consent = document.getElementById("consent");
  var sendBtn = document.getElementById("send");
  var handler = null;

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function scrollDown(){ window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}); }
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
  function addEl(html,cls){var d=document.createElement("div");d.className=cls;d.innerHTML=html;chat.appendChild(d);scrollDown();return d;}
  async function bot(text){
    var t=addEl('<span class="typing"><i></i><i></i><i></i></span>',"msg bot");
    await sleep(550);
    t.innerHTML=esc(text);scrollDown();
  }
  function me(text){addEl(esc(text),"msg me");}
  function showComposer(opts){
    composer.classList.remove("hidden");
    field.type=opts.type||"text"; field.placeholder=opts.placeholder||"Type here"; field.value="";
    field.setAttribute("inputmode",opts.type==="email"?"email":"text");
    consentWrap.classList.toggle("hidden",!opts.consent);
    sendBtn.textContent=opts.button||"Send";
    setTimeout(function(){field.focus({preventScroll:true});},50);
  }
  function hideComposer(){composer.classList.add("hidden");}

  function askText(opts){ /* resolves with text */
    return new Promise(function(res){
      showComposer(opts);
      handler=function(){
        var v=field.value.trim();
        if(!v&&!opts.optional){return;}
        if(opts.type==="email"&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){field.setCustomValidity("x");field.reportValidity();field.setCustomValidity("");return;}
        if(opts.consent&&!consent.checked){alert("Please tick the box to agree to receive emails.");return;}
        handler=null;hideComposer();
        if(v) me(v);
        res(v);
      };
    });
  }
  function askChoice(options,multi){
    return new Promise(function(res){
      var box=document.createElement("div");box.className="chips";
      var picked=[];
      options.forEach(function(o){
        var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=o.label;
        b.onclick=function(){
          if(!multi){box.remove();me(o.label);res(o);return;}
          var k=picked.indexOf(o);
          if(k>-1){picked.splice(k,1);b.classList.remove("on");}else{picked.push(o);b.classList.add("on");}
          done.disabled=picked.length===0;
        };
        box.appendChild(b);
      });
      var done;
      if(multi){
        done=document.createElement("button");done.type="button";done.className="btn btn-dark";done.textContent="Done";done.disabled=true;
        done.onclick=function(){box.remove();me(picked.map(function(p){return p.label;}).join(", "));res(picked);};
        box.appendChild(done);
      }
      chat.appendChild(box);scrollDown();
    });
  }
  form.addEventListener("submit",function(e){e.preventDefault();if(handler)handler();});

  function keywordInterests(text){
    var t=text.toLowerCase(),found=[];
    Object.keys(WORDS).forEach(function(k){
      if(WORDS[k].some(function(w){return t.indexOf(w)>-1;}))found.push(k);
    });
    return found;
  }
  var LABELS={trade:"making or selling things",talk:"talking to people",write:"writing",create:"creative work",numbers:"numbers and logic",organise:"organising",sell:"selling",teach:"teaching",tech:"tech",};

  function hitsCount(s,ints){return s.i.filter(function(x){return ints.indexOf(x)>-1;}).length;}
  function score(){
    var ints=A.strong.slice();
    keywordInterests(A.strongText+" "+A.background).forEach(function(k){if(ints.indexOf(k)<0)ints.push(k);});
    A.interests=ints;
    var budgetMax={"0":0,"1":1,"2":2,"3":2}[A.budgetKey];
    var out=SKILLS.map(function(s){
      var sc=0,hits=s.i.filter(function(x){return ints.indexOf(x)>-1;});
      sc+=hits.length*3;
      if(A.expKey==="none"){ if(s.lv===1)sc+=2; if(s.lv===3)sc-=5; }
      else if(A.expKey==="some"){ if(s.lv===1)sc+=1; if(s.lv===3&&hitsCount(s,ints)>=2)sc+=1.5; if(s.lv===2)sc+=0.5; }
      else { if(s.lv===1)sc-=0.5; if(s.lv===2)sc+=1; if(s.lv===3)sc+=2; }
      if(ints.indexOf("trade")>-1&&s.i.indexOf("trade")>-1)sc+=3;
      var typed=(A.strongText+" "+A.background).toLowerCase();
      var nm=s.n.toLowerCase().replace(/[^a-z ]/g," ").split(" ").filter(function(w){return w.length>3;});
      var nmHit=nm.filter(function(w){return typed.indexOf(w.slice(0,5))>-1;}).length;
      if(nmHit)sc+=Math.min(4,nmHit*2);
      if(s.goals.indexOf(A.goalKey)>-1)sc+=2;
      if(A.deviceKey==="phone"&&s.dev==="laptop")sc-=6;
      if(s.cost>budgetMax)sc-=4;
      if(A.timeKey==="short"&&s.speed===3)sc-=2;
      if(A.goalKey==="side"&&s.speed===1)sc+=1;
      if(A.goalKey==="job"&&s.lv===2)sc+=0.5;
      return {s:s,score:sc,hits:hits};
    }).sort(function(a,b){return b.score-a.score;});
    return out.slice(0,3);
  }
  function why(m){
    var parts=[];
    if(m.hits.length)parts.push("You said you enjoy "+m.hits.map(function(h){return LABELS[h];}).slice(0,2).join(" and ")+".");
    parts.push(m.s.dev==="phone"?"You can start with just a phone.":"You will need a laptop for this one.");
    return parts.join(" ");
  }
  function costLabel(c){return c===2?"Medium":"Low";}

  function lockedRows(){
    return ["First 3 steps to start","What it pays (estimates)","Where to find work","Job titles to search","Skills and tools to learn"]

  }

  async function run(){
    await bot("Hi! I'm the Bayzicks path finder. In about 2 minutes I'll match you with beginner-friendly digital skills. What's your first name?");
    A.name=await askText({placeholder:"Your first name",optional:true,button:"Next"})||"";
    await bot((A.name?"Nice to meet you, "+A.name+"! ":"")+"What are you good at, or enjoy doing? Pick all that fit.");
    var s=await askChoice([
      {label:"Talking to people",v:"talk"},{label:"Writing",v:"write"},{label:"Creative work",v:"create"},
      {label:"Numbers and logic",v:"numbers"},{label:"Organising things",v:"organise"},{label:"Selling",v:"sell"},
      {label:"Making or selling things (baking, fashion, crafts, trading)",v:"trade"},{label:"Teaching or explaining",v:"teach"},{label:"Tech and computers",v:"tech"},{label:"Not sure yet",v:"none"}
    ],true);
    A.strong=s.map(function(x){return x.v;}).filter(function(v){return v!=="none";});
    A.strongLabels=s.map(function(x){return x.label;});
    await bot("Anything else you're good at, or things people often ask you for help with? Type a few words, or skip.");
    A.strongText=await askText({placeholder:"e.g. I draw, I'm good with Excel",optional:true,button:"Next"});
    await bot("What is your main goal?");
    var g=await askChoice([
      {label:"Earn some side income",v:"side"},{label:"Get a remote job",v:"job"},
      {label:"Build my own online business",v:"biz"},{label:"Not sure, just exploring",v:"side"}
    ]);
    A.goal=g.label;A.goalKey=g.v;
    await bot("How much can you spend to get started, on a course, tools or data?");
    var b=await askChoice([
      {label:"Almost nothing (free only)",v:"0"},{label:"Under ₦50,000",v:"1"},
      {label:"₦50,000 to ₦200,000",v:"2"},{label:"More than ₦200,000",v:"3"}
    ]);
    A.budget=b.label;A.budgetKey=b.v;
    await bot("What do you have to work with right now?");
    var d=await askChoice([
      {label:"A phone only",v:"phone"},{label:"A phone and a laptop",v:"laptop"},{label:"A laptop",v:"laptop"}
    ]);
    A.device=d.label;A.deviceKey=d.v;
    await bot("How would you describe your experience so far in any kind of work?");
    var x=await askChoice([
      {label:"Complete beginner",v:"none"},{label:"Some experience or training",v:"some"},{label:"Experienced professional",v:"pro"}
    ]);
    A.experience=x.label;A.expKey=x.v;
    await bot("How much time can you give this each day?");
    var t=await askChoice([
      {label:"Under 1 hour",v:"short"},{label:"1 to 2 hours",v:"mid"},{label:"3 hours or more",v:"long"}
    ]);
    A.time=t.label;A.timeKey=t.v;
    await bot("Tell me a little about your background in a sentence or two: what you studied, or the work you have done. It's fine if it has nothing to do with computers.");
    A.background=await askText({placeholder:"e.g. I studied biology and I work in an office",optional:true,button:"Next"});
    await bot("Almost done! Where should I send your results? I'll also keep a note of your answers so I can help you further.");
    A.email=await askText({type:"email",placeholder:"you@email.com",consent:true,button:"Show my path"});

    var matches=score();
    await bot("Give me a second while I match your answers...");
    var ok=await save(matches);
    if(!ok){
      addEl("I couldn't save your answers just now. Please check your internet and refresh this page to try again.","err");
      return;
    }
    await bot((A.name?A.name+", ":"")+"here are the 3 skills that fit you best right now:");
    matches.forEach(function(m,idx){
      var tags='<span class="tag">Beginner-friendly: '+(m.s.lv===1?"Yes":m.s.lv===2?"With preparation":"Best with some experience")+'</span>'+
               '<span class="tag">Start cost: '+costLabel(m.s.cost)+'</span>'+
               '<span class="tag">'+(m.s.dev==="phone"?"Phone is enough":"Laptop needed")+'</span>'+
               (m.s.gem?'<span class="tag gem">Hidden gem</span>':"");
      addEl('<h3>'+(idx+1)+'. '+esc(m.s.n)+'</h3><p class="why">'+esc(m.s.d)+'</p><p class="why"><strong>Why it fits you:</strong> '+esc(why(m))+'</p><div class="tags">'+tags+'</div><ul class="locked">'+lockedRows()+'</ul>',"card");
    });
    if(A.interests.indexOf("trade")>-1){
      await bot("One more thing. The hands-on skill you already have is a real advantage, because you know what customers actually want. You have two good routes: take what you do online with digital and affiliate marketing, or use your people skills in sales and customer support. Choosing the right one for you, and narrowing it down to one clear plan, is exactly what the roadmap and a free consultation are for.");
    }
    await bot("The full details for each skill, including the steps, the pay estimates and where to find work, are in the brochure and in your personal roadmap. Here is how you can go next:");
    var booking=BOOKING_URL?'<div class="opt"><strong>Talk it through with me</strong>Book a free consultation and we will look at your answers together.<a class="btn btn-ghost" style="color:var(--parchment);border-color:var(--parchment)" href="'+BOOKING_URL+'" target="_blank" rel="noopener">Book a free consultation</a></div>':"";
    addEl('<h3>Your next step</h3>'+
      '<div class="opt"><strong>Get your personal roadmap (₦3,000)</strong>A plan written just for you: your best-fit skill, your first steps, where to learn and who to learn from. Delivered by email within 24 hours.<a class="btn btn-primary" href="'+ROADMAP_URL+'" target="_blank" rel="noopener">Get my personal roadmap</a><p style="font-size:.8rem;margin:8px 0 0;opacity:.8">Please use the same email you gave here ('+esc(A.email)+') when you pay.</p></div>'+
      booking+
      '<div class="opt"><strong>See all 524 skills</strong>Every skill with its steps, pay estimates and where to find work.<a class="btn btn-ghost" style="color:var(--parchment);border-color:var(--parchment)" href="'+BROCHURE_URL+'" target="_blank" rel="noopener">Open the full brochure</a></div>'+
      '<div class="opt"><strong>Start free</strong>Read the free guide to 25 remote skills.<a class="btn btn-ghost" style="color:var(--parchment);border-color:var(--parchment)" href="'+FREE_GUIDE_URL+'" target="_blank" rel="noopener">Open the free guide</a></div>',"next");
  }

  async function save(matches){
    try{
      var r=await fetch(INTAKE_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
        email:A.email,name:A.name,consent:true,company_website:document.getElementById("hp").value,
        answers:{strengths:A.strongLabels.join(", "),strengthsExtra:A.strongText,goal:A.goal,budget:A.budget,device:A.device,time:A.time,experience:A.experience,background:A.background},
        matches:matches.map(function(m){return m.s.n;})
      })});
      return r.ok;
    }catch(e){return false;}
  }
  run();
})();
</script>
</body>
</html>
